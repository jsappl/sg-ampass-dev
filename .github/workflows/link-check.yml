name: Link Check

# Deliberately separate from Deploy Hugo: a partner site being down must
# never block a release. Runs on a schedule and on demand only.
on:
  schedule:
    # 06:00 UTC on the first of each month.
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      # Build first: several links live in templates (Instagram, the
      # OpenStreetMap embed) and never appear in content/.
      - name: Build
        run: hugo --minify

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Instagram serves bots a 403 regardless, so it would fail every
          # run. The OSM embed is a generated iframe src, not a page.
          args: >-
            --no-progress
            --max-retries 2
            --timeout 20
            --exclude "instagram\.com"
            --exclude "openstreetmap\.org/export/embed"
            ./public/**/*.html
          fail: false
          output: lychee-report.md

      - name: Open an issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Defekte Links gefunden"
          content-filepath: lychee-report.md
          labels: link-check
